name: Generate Android PNG icons
on:
  push:
    paths:
      - '.github/workflows/generate-icons.yml'
      - 'icon.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet cairosvg pillow
      - name: Render PNG icons from approved SVG
        run: |
          python - <<'PY'
          import cairosvg
          for size in (192,512):
              cairosvg.svg2png(url='icon.svg',write_to=f'icon-{size}.png',output_width=size,output_height=size)
          PY
      - name: Commit PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "Generate crisp Android PNG icons" && git push)
