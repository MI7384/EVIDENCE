let db,items=[],photos=[],page={kind:'actions'},gallery=[],gi=0;const app=document.getElementById('app');app.addEventListener('input',e=>{if(['name','l','w','h','note'].includes(e.target.id))captureItemDraft()});const id=()=>crypto.randomUUID();const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateRange=(a,b)=>[a,b].map(d=>d?new Date(d+'T12:00:00').toLocaleDateString('cs-CZ'):'–').join(' – ');const fmt=n=>Number(n||0).toLocaleString('cs-CZ',{maximumFractionDigits:6});const children=(p,t)=>items.filter(x=>x.parent===p&&x.type===t).sort((a,b)=>t==="action"?b.created-a.created:a.created-b.created);const get=i=>items.find(x=>x.id===i);const volume=x=>[x.l,x.w,x.h].every(v=>v!==''&&v!=null&&Number(v)>=0)?Number(x.l)*Number(x.w)*Number(x.h)/1000000:0;function total(i){let x=get(i);if(!x)return 0;if(x.type==='item')return volume(x);return children(i,x.type==='action'?'sheet':'item').reduce((s,c)=>s+total(c.id),0)}

let pickerMode='new';function openShipperPicker(mode){pickerMode=mode;const current=document.getElementById(mode==='new'?'newShipper':'shipper').value;document.getElementById('shipperChoices').innerHTML=[['','Vyber spedici'],['DSV','DSV'],['Kühne + Nagel','Kühne + Nagel'],['other','Jiné']].map(([v,label])=>'<button type="button" class="picker-option '+(v===current?'active':'')+'" onclick="selectShipper('+JSON.stringify(v).replaceAll('"','&quot;')+')">'+label+'</button>').join('');document.getElementById('shipperPicker').hidden=false}function selectShipper(value){const prefix=pickerMode==='new'?'new':'edit';document.getElementById(prefix==='new'?'newShipper':'shipper').value=value;document.getElementById(prefix+'ShipperButton').innerHTML=(value==='other'?'Jiné':value||'Vyber spedici')+' <span>▾</span>';document.getElementById(prefix+'OtherShipperWrap').hidden=value!=='other';closeShipperPicker()}function closeShipperPicker(){document.getElementById('shipperPicker').hidden=true}function chosenShipper(mode){const prefix=mode==='new'?'new':'edit';const value=document.getElementById(prefix==='new'?'newShipper':'shipper').value;return value==='other'?document.getElementById(prefix+'OtherShipper').value.trim():value}function create(type,parent){page={kind:'new',type,parent};history.pushState({...page},'','#new');render()}async function saveNew(){const n=document.getElementById('newName')?.value.trim();if(!n){alert('Vyplň název.');return}const {type,parent}=page;let x={id:id(),type,parent:parent||null,name:n,created:Date.now()+Math.random(),l:'',w:'',h:'',note:''};if(type==='sheet'){x.shipper=chosenShipper('new');if(document.getElementById('newShipper').value==='other'&&!x.shipper){alert('Zadej název jiné spedice.');return}}await put('items',x);nav(type==='sheet'?'sheets': 'edit',type==='sheet'?parent:x.id)}
function updateVolume(){document.getElementById('v').textContent=fmt(volume({l:document.getElementById('l').value,w:document.getElementById('w').value,h:document.getElementById('h').value}))+' m³'}async function save(i){let x={...get(i),name:document.getElementById('name').value.trim()};if(!x.name)return alert('Zadej název');if(x.type==='action'){x.place=document.getElementById('place').value;for(let k of ['mountFrom','mountTo','fairFrom','fairTo','dismountFrom','dismountTo'])x[k]=document.getElementById(k).value}if(x.type==='sheet'){x.shipper=chosenShipper('edit');if(document.getElementById('shipper').value==='other'&&!x.shipper){alert('Zadej název jiné spedice.');return}}if(x.type==='item'){for(let k of ['l','w','h'])x[k]=document.getElementById(k).value;x.note=document.getElementById('note').value}await put('items',x);if(x.type==='item')clearItemDraft(x.id);nav(x.type==='item'?'entries':x.type==='sheet'?'sheets':'actions',x.parent)}function appConfirm(message){return new Promise(resolve=>{const overlay=document.getElementById('confirmOverlay'),ok=document.getElementById('confirmAccept'),cancel=document.getElementById('confirmCancel');document.getElementById('confirmMessage').textContent=message;const restoring=message.startsWith('Nahradit');document.getElementById('confirmTitle').textContent=restoring?'Obnovení zálohy':'Potvrzení smazání';ok.textContent=restoring?'Nahradit':'Smazat';function finish(result){overlay.hidden=true;ok.onclick=null;cancel.onclick=null;resolve(result)}ok.onclick=()=>finish(true);cancel.onclick=()=>finish(false);overlay.hidden=false;cancel.focus()})}async function erase(i){if(!await appConfirm('Smazat záznam včetně všech podřízených položek a fotografií?'))return;async function walk(i){for(let x of items.filter(x=>x.parent===i))await walk(x.id);for(let p of photos.filter(p=>p.item===i))await remove('photos',p.id);await remove('items',i)}await walk(i);render()}
let cameraStream=null,cameraItem=null;async function openCamera(item){captureItemDraft();cameraItem=item;overlayBack();const panel=document.getElementById('cameraView'),msg=document.getElementById('cameraMessage');msg.textContent='Spouštím fotoaparát…';panel.style.display='flex';try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('Tento prohlížeč nepodporuje přímý přístup k fotoaparátu.');cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});document.getElementById('cameraVideo').srcObject=cameraStream;msg.textContent='Zaměř předmět a klepni na Vyfotit.'}catch(e){closeCamera();const message=e.name==='NotAllowedError'?'Přístup k fotoaparátu byl zamítnut. Povol fotoaparát v nastavení Chrome pro tuto stránku.':e.name==='NotFoundError'?'Fotoaparát nebyl nalezen.':'Fotoaparát se nepodařilo spustit: '+e.message;alert(message+' Zkusíme systémový fotoaparát.');document.getElementById('cameraFallback')?.click()}}function closeCamera(fromBack=false){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}document.getElementById('cameraVideo').srcObject=null;document.getElementById('cameraView').style.display='none';if(!fromBack&&history.state?.overlay)history.back()}async function takeCameraPhoto(){const v=document.getElementById('cameraVideo');if(!cameraStream||!v.videoWidth){alert('Počkej, až se objeví obraz z fotoaparátu.');return}const canvas=document.createElement('canvas');const scale=Math.min(1,1600/v.videoWidth);canvas.width=Math.round(v.videoWidth*scale);canvas.height=Math.round(v.videoHeight*scale);canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',0.82);try{await put('photos',{id:id(),item:cameraItem,data});closeCamera();await refreshItemPhotos(cameraItem)}catch(e){alert('Fotografii se nepodařilo uložit: '+e.message)}}
async function refreshItemPhotos(item){photos=await all('photos');if(page.kind==='edit'&&page.id===item){const box=app.querySelector('.photos');if(box)box.innerHTML=photos.filter(p=>p.item===item).map(p=>`<div class="photo"><img src="${p.data}" onclick="showPhoto('${item}','${p.id}')"><button class="danger" onclick="deletePhoto('${p.id}')">×</button></div>`).join('')}else await render()}
async function addPhotos(ev,item){captureItemDraft();try{for(let f of ev.target.files){if(!f.type.startsWith('image/'))continue;let data=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});await put('photos',{id:id(),item,data})}await refreshItemPhotos(item);ev.target.value=''}catch(e){alert('Fotografii se nepodařilo uložit. Zkontroluj volné místo.')}}
async function deletePhoto(i){captureItemDraft();if(await appConfirm('Smazat fotografii?')){const p=photos.find(p=>p.id===i);await remove('photos',i);await refreshItemPhotos(p?.item)}}
function showPhoto(item,i){overlayBack();gallery=photos.filter(p=>p.item===item);gi=gallery.findIndex(p=>p.id===i);document.getElementById('viewer').style.display='flex';movePhoto(0)}function movePhoto(n){if(!gallery.length)return;gi=(gi+n+gallery.length)%gallery.length;document.getElementById('big').src=gallery[gi].data;document.getElementById('photoCount').textContent=gallery.length>1?(gi+1)+' / '+gallery.length:''}let photoTouchX=null,photoTouchY=null;const viewerImage=document.getElementById('big');viewerImage.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;photoTouchX=e.touches[0].clientX;photoTouchY=e.touches[0].clientY},{passive:true});viewerImage.addEventListener('touchend',e=>{if(photoTouchX===null||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-photoTouchX,dy=e.changedTouches[0].clientY-photoTouchY;photoTouchX=null;photoTouchY=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3)movePhoto(dx<0?1:-1)},{passive:true});viewerImage.addEventListener('touchcancel',()=>{photoTouchX=null;photoTouchY=null});function closePhoto(fromBack=false){document.getElementById('viewer').style.display='none';if(!fromBack&&history.state?.overlay)history.back()}
function printData(i,withPhotos=false,mail=false){let x=get(i),sheets=x.type==='action'?children(i,'sheet'):[x];let w=window.open('','_blank');if(!w)return alert('Povol vyskakovací okna');let h=`<!doctype html><html lang="cs"><meta charset="utf-8"><title>evidence – tisk</title><style>*{box-sizing:border-box}body{font:14px system-ui,Arial;background:#f2f3f5;color:#222;margin:0;padding:18px}h1{background:#193D63;color:#fff;text-align:center;border-radius:9px;padding:15px;font-size:22px}h2{color:#193D63;margin:24px 0 12px}h3{color:#193D63}table{border-collapse:separate;border-spacing:0;width:100%;margin-bottom:18px;background:white;border:1px solid #d7dce2;border-radius:9px;overflow:hidden}th{background:#193D63;color:white;font-weight:600}td,th{border-bottom:1px solid #d7dce2;padding:9px;text-align:left;vertical-align:top}tr:last-child td{border-bottom:0}tbody tr:nth-child(even){background:#f2f5f8}section{background:white;border-radius:9px;padding:12px;margin:12px 0}p{line-height:1.5}@media print{body{background:white;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}h1{border-radius:0}table{break-inside:auto}tr{break-inside:avoid}section{break-inside:avoid}}@page{size:A4 landscape;margin:12mm}</style><h1>${safe(x.name)}</h1>`;for(let s of sheets){h+=`<h2>${safe(s.name)}</h2><table><tr><th>Položka</th><th>Délka</th><th>Šířka</th><th>Výška</th><th>m³</th><th>Poznámka</th></tr>`;for(let z of children(s.id,'item'))h+=`<tr><td>${safe(z.name)}</td><td>${safe(z.l)}</td><td>${safe(z.w)}</td><td>${safe(z.h)}</td><td>${fmt(volume(z))}</td><td>${safe(z.note)}</td></tr>`;h+=`</table>`;if(withPhotos){for(let z of children(s.id,'item')){let pics=photos.filter(p=>p.item===z.id);if(pics.length)h+=`<section style="break-inside:avoid"><h3>${safe(z.name)} – fotografie</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${pics.map(p=>`<img src="${p.data}" style="width:100%;max-height:260px;object-fit:contain;break-inside:avoid">`).join('')}</div></section>`}}h+=`<p><b>Celkem: ${fmt(total(s.id))} m³</b></p>`}h+=withPhotos?`<p style="color:#666">Pro uložení PDF zvol v nabídce tisku „Uložit jako PDF“.</p>`:`<script>setTimeout(()=>window.print(),600)<\/script>`;w.document.write(h);w.document.close();if(withPhotos)setTimeout(()=>w.print(),1200);if(mail)alert('Po uložení PDF ho přilož k e-mailu. Automatické připojení PDF není ve všech prohlížečích dostupné.')}
function emailData(i){alert('Nejprve vytvoř PDF s fotografiemi a v dialogu zvol Uložit jako PDF. Potom soubor přilož v e-mailové aplikaci. Přímé připojení PDF zatím není k dispozici.');printData(i,true,false)}async function backup(){let data={version:1,items:await all('items'),photos:await all('photos')};let url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='evidence-zaloha-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function restore(ev){try{let f=ev.target.files[0];if(!f)return;let data=JSON.parse(await f.text());if(!Array.isArray(data.items)||!Array.isArray(data.photos))throw Error('Neplatný soubor');if(!await appConfirm('Nahradit všechna současná data obsahem zálohy?'))return;await clear('items');await clear('photos');for(let x of data.items)await put('items',x);for(let p of data.photos)await put('photos',p);nav('actions')}catch(e){alert('Obnovení se nezdařilo: '+e.message)}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});openDB();
</script></body></html>
