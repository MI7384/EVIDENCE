#launchSplash{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .25s ease}#launchSplash[hidden]{display:none}#launchSplash svg{width:min(64vw,260px);height:auto;display:block}#launchSplash.hide{opacity:0;pointer-events:none}@media print{#launchSplash{display:none!important}}</style></head><body><div id="launchSplash" aria-label="Spouští se evidence" hidden><svg viewBox="0 0 300 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="evidence"><g fill="#193D63" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="400"><text x="30" y="74">e</text><text x="30" y="150">vi</text><text x="30" y="226">den</text><text x="30" y="302">ce</text></g></svg></div><header><strong>evidence</strong></header><main id="app"></main><div id="viewer" class="viewer"><img id="big"><div class="buttons"><button onclick="movePhoto(-1)">◀</button><button onclick="closePhoto()">Zavřít</button><button onclick="movePhoto(1)">▶</button></div></div><div id="cameraView" class="viewer" style="z-index:20"><video id="cameraVideo" autoplay playsinline muted style="width:100%;max-height:72vh;object-fit:contain"></video><div class="buttons"><button type="button" onclick="takeCameraPhoto()">📸 Vyfotit</button><button type="button" onclick="closeCamera()">Zavřít</button></div><p id="cameraMessage" style="color:white;font-size:14px;text-align:center"></p></div><script>
const splashEl=document.getElementById('launchSplash');if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true){splashEl.hidden=false;setTimeout(()=>{splashEl.classList.add('hide');setTimeout(()=>splashEl.remove(),300)},2000)}else{splashEl.remove()}
let db,items=[],photos=[],page={kind:'actions'},gallery=[],gi=0;const app=document.getElementById('app');const id=()=>crypto.randomUUID();const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateRange=(a,b)=>[a,b].map(d=>d?new Date(d+'T12:00:00').toLocaleDateString('cs-CZ'):'–').join(' – ');const fmt=n=>Number(n||0).toLocaleString('cs-CZ',{maximumFractionDigits:6});const children=(p,t)=>items.filter(x=>x.parent===p&&x.type===t).sort((a,b)=>t==="action"?b.created-a.created:a.created-b.created);const get=i=>items.find(x=>x.id===i);const volume=x=>[x.l,x.w,x.h].every(v=>v!==''&&v!=null&&Number(v)>=0)?Number(x.l)*Number(x.w)*Number(x.h)/1000000:0;function total(i){let x=get(i);if(!x)return 0;if(x.type==='item')return volume(x);return children(i,x.type==='action'?'sheet':'item').reduce((s,c)=>s+total(c.id),0)}
function openDB(){let r=indexedDB.open('evidence-pwa',1);r.onupgradeneeded=()=>{r.result.createObjectStore('items',{keyPath:'id'});r.result.createObjectStore('photos',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;render()};r.onerror=()=>alert('Databázi se nepodařilo otevřít.')}function all(n){return new Promise((ok,no)=>{let r=db.transaction(n).objectStore(n).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function put(n,v){return new Promise((ok,no)=>{let r=db.transaction(n,'readwrite').objectStore(n).put(v);r.onsuccess=ok;r.onerror=()=>no(r.error)})}function remove(n,i){return new Promise((ok,no)=>{let r=db.transaction(n,'readwrite').objectStore(n).delete(i);r.onsuccess=ok;r.onerror=()=>no(r.error)})}function clear(n){return new Promise((ok,no)=>{let r=db.transaction(n,'readwrite').objectStore(n).clear();r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function nav(kind,id,replace=false){page={kind,id};if(!replace)history.pushState({kind,id},'', '#'+kind+(id?'/'+id:''));render()}window.addEventListener('popstate',e=>{if(document.getElementById('cameraView').style.display==='flex'){closeCamera(true);return}if(document.getElementById('viewer').style.display==='flex'){closePhoto(true);return}page=e.state?.kind?e.state:{kind:'actions'};render()});history.replaceState({kind:'actions'},'','#actions');function overlayBack(){history.pushState({overlay:true},'','#photo');}const button=(label,fn,cl='')=>`<button class="${cl}" onclick="${fn}">${label}</button>`;function row(x,next){let detail=x.type==='action'?`Místo: ${safe(x.place||'–')}<br>Montáž: ${dateRange(x.mountFrom,x.mountTo)}<br>Průběh: ${dateRange(x.fairFrom,x.fairTo)}<br>Demontáž: ${dateRange(x.dismountFrom,x.dismountTo)}<br>Spedice: ${safe(x.shipper||'–')}`:x.type==='item'?`Rozměry: ${safe(x.l||'–')} × ${safe(x.w||'–')} × ${safe(x.h||'–')} cm · ${fmt(volume(x))} m³`:`Kubatura: ${fmt(total(x.id))} m³`;return `<div class="card"><div class="line"><div><strong>${safe(x.name)}</strong><div class="muted">${detail}</div></div>${button('Otevřít',`nav('${next}','${x.id}')`)}</div>${x.type==='item'?`<div class="photos">${photos.filter(p=>p.item===x.id).map(p=>`<img loading="lazy" role="button" tabindex="0" src="${p.data}" alt="Fotografie položky" onclick="showPhoto(\'${x.id}\',\'${p.id}\')" style="width:78px;height:78px;object-fit:cover;border-radius:7px;cursor:pointer">`).join('')}</div>`:'' }<div class="buttons">${button('Upravit',`nav('edit','${x.id}')`,'secondary')}${button('Smazat',`erase('${x.id}')`,'danger')}</div></div>`}
async function render(){items=await all('items');photos=await all('photos');let h='';if(page.kind==='actions'){h=`<h2>veletrhy</h2><div class="toolbar">${button('+ Přidat veletrh',"create('action',null)")}${button('Stáhnout zálohu','backup()','secondary')}<label class="filebutton" style="margin:0">Obnovit zálohu<input type="file" accept=".json" onchange="restore(event)"></label></div>`;for(let x of children(null,'action'))h+=row(x,'sheets')}
if(page.kind==='sheets'){let a=get(page.id);if(!a)return nav('actions');h=`<div class="toolbar">${button('← Veletrhy',"nav('actions')",'secondary')}${button('+ Přidat list',`create('sheet','${a.id}')`)}${button('Export',`nav('export','${a.id}')`,'secondary')}</div><h2>${safe(a.name)}</h2><p class="muted">Celková kubatura: ${fmt(total(a.id))} m³</p>`;for(let x of children(a.id,'sheet'))h+=row(x,'entries')}
if(page.kind==='entries'){let s=get(page.id);if(!s)return nav('actions');h=`<div class="toolbar">${button('← Listy',`nav('sheets','${s.parent}')`,'secondary')}${button('+ Přidat položku',`create('item','${s.id}')`)}${button('Export',`nav('export','${s.id}')`,'secondary')}</div><h2>${safe(s.name)}</h2><p class="muted">Kubatura listu: ${fmt(total(s.id))} m³</p>`;for(let x of children(s.id,'item'))h+=row(x,'edit')}
if(page.kind==='export'){let x=get(page.id);if(!x)return nav('actions');h=`<div class="toolbar">${button('← Zpět',`nav('${x.type==='action'?'sheets':'entries'}','${x.id}')`,'secondary')}</div><h2>export – ${safe(x.name)}</h2><div class="card"><p>Vyber výstup pro ${x.type==='action'?'celý veletrh':'tento list'}:</p><div class="buttons">${button('Tisk',`printData('${x.id}',false)`)}${button('PDF s fotografiemi',`printData('${x.id}',true)`)}${button('PDF bez fotografií',`printData('${x.id}',false)`)}${button('Poslat e-mailem',`emailData('${x.id}')`)}</div></div>`}if(page.kind==='new'){let t=page.type,p=page.parent,back=t==='action'?'actions':t==='sheet'?'sheets':'entries';h=`<div class="toolbar">${button('← Zpět',`nav('${back}','${p||''}')`,'secondary')}</div><h2>${t==='action'?'Nový veletrh':t==='sheet'?'Nový list':'Nová položka'}</h2><div class="card"><label>${t==='action'?'Název veletrhu':t==='sheet'?'Název listu':'Název položky'}</label><input id="newName" autocomplete="off" placeholder="Zadej název"><div class="buttons">${button('Pokračovat',`saveNew()`)}${button('Zrušit',`nav('${back}','${p||''}')`,'secondary')}</div></div>`}if(page.kind==='edit'){let x=get(page.id);if(!x)return nav('actions');let back=x.type==='item'?'entries':x.type==='sheet'?'sheets':'actions';h=`<div class="toolbar">${button('← Zpět',`nav('${back}','${x.parent||''}')`,'secondary')}</div><h2>${x.type==='item'?'Položka':x.type==='sheet'?'Evidenční list':'Veletrh'}</h2><div class="card"><label>Název</label><input id="name" value="${safe(x.name)}">${x.type==='action'?`<label>Místo</label><input id="place" value="${safe(x.place||'')}">${[['Montáž','mountFrom','mountTo'],['Průběh veletrhu','fairFrom','fairTo'],['Demontáž','dismountFrom','dismountTo']].map(([title,a,b])=>`<h3>${title}</h3><div class="dims" style="grid-template-columns:1fr 1fr"><div><label>Od</label><input type="date" id="${a}" value="${safe(x[a]||'')}"></div><div><label>Do</label><input type="date" id="${b}" value="${safe(x[b]||'')}"></div></div>`).join('')}<label>Název spedice</label><select id="shipper"><option value="Kühne + Nagel" ${x.shipper==='Kühne + Nagel'?'selected':''}>Kühne + Nagel</option><option value="DSV" ${x.shipper==='DSV'?'selected':''}>DSV</option></select>`:''}`;if(x.type==='item'){h+=`<div class="dims">${[['l','Délka'],['w','Šířka'],['h','Výška']].map(([k,n])=>`<div><label>${n} (cm)</label><input type="number" min="0" step="any" id="${k}" value="${safe(x[k])}" oninput="updateVolume()"></div>`).join('')}</div><div class="total">Kubatura: <strong id="v">${fmt(volume(x))} m³</strong></div><label>Poznámka</label><textarea id="note">${safe(x.note)}</textarea><label>Fotografie</label><div class="buttons"><button type="button" onclick="openCamera('${x.id}')">📷 Pořídit fotografii</button><input id="cameraFallback" type="file" accept="image/*" capture="environment" style="display:none" onchange="addPhotos(event,'${x.id}')"><label class="filebutton" style="margin:0;position:relative;overflow:hidden">Vybrat z galerie<input type="file" accept="image/*" multiple style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;pointer-events:auto" onchange="addPhotos(event,'${x.id}')"></label></div><div class="photos">${photos.filter(p=>p.item===x.id).map(p=>`<div class="photo"><img src="${p.data}" onclick="showPhoto('${x.id}','${p.id}')"><button class="danger" onclick="deletePhoto('${p.id}')">×</button></div>`).join('')}</div>`}h+=`<div class="buttons">${button('Uložit',`save('${x.id}')`)}</div></div>`}app.innerHTML=h}
function create(type,parent){page={kind:'new',type,parent};history.pushState({...page},'','#new');render()}async function saveNew(){const n=document.getElementById('newName')?.value.trim();if(!n){alert('Vyplň název.');return}const {type,parent}=page;let x={id:id(),type,parent:parent||null,name:n,created:Date.now()+Math.random(),l:'',w:'',h:'',note:''};await put('items',x);nav(type==='sheet'?'sheets': 'edit',type==='sheet'?parent:x.id)}
function updateVolume(){document.getElementById('v').textContent=fmt(volume({l:document.getElementById('l').value,w:document.getElementById('w').value,h:document.getElementById('h').value}))+' m³'}async function save(i){let x={...get(i),name:document.getElementById('name').value.trim()};if(!x.name)return alert('Zadej název');if(x.type==='action'){x.place=document.getElementById('place').value;x.shipper=document.getElementById('shipper').value;for(let k of ['mountFrom','mountTo','fairFrom','fairTo','dismountFrom','dismountTo'])x[k]=document.getElementById(k).value}if(x.type==='item'){for(let k of ['l','w','h'])x[k]=document.getElementById(k).value;x.note=document.getElementById('note').value}await put('items',x);nav(x.type==='item'?'entries':x.type==='sheet'?'sheets':'actions',x.parent)}async function erase(i){if(!confirm('Smazat záznam včetně všech podřízených položek a fotografií?'))return;async function walk(i){for(let x of items.filter(x=>x.parent===i))await walk(x.id);for(let p of photos.filter(p=>p.item===i))await remove('photos',p.id);await remove('items',i)}await walk(i);render()}
let cameraStream=null,cameraItem=null;async function openCamera(item){cameraItem=item;overlayBack();const panel=document.getElementById('cameraView'),msg=document.getElementById('cameraMessage');msg.textContent='Spouštím fotoaparát…';panel.style.display='flex';try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('Tento prohlížeč nepodporuje přímý přístup k fotoaparátu.');cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});document.getElementById('cameraVideo').srcObject=cameraStream;msg.textContent='Zaměř předmět a klepni na Vyfotit.'}catch(e){closeCamera();const message=e.name==='NotAllowedError'?'Přístup k fotoaparátu byl zamítnut. Povol fotoaparát v nastavení Chrome pro tuto stránku.':e.name==='NotFoundError'?'Fotoaparát nebyl nalezen.':'Fotoaparát se nepodařilo spustit: '+e.message;alert(message+' Zkusíme systémový fotoaparát.');document.getElementById('cameraFallback')?.click()}}function closeCamera(fromBack=false){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}document.getElementById('cameraVideo').srcObject=null;document.getElementById('cameraView').style.display='none';if(!fromBack&&history.state?.overlay)history.back()}async function takeCameraPhoto(){const v=document.getElementById('cameraVideo');if(!cameraStream||!v.videoWidth){alert('Počkej, až se objeví obraz z fotoaparátu.');return}const canvas=document.createElement('canvas');const scale=Math.min(1,1600/v.videoWidth);canvas.width=Math.round(v.videoWidth*scale);canvas.height=Math.round(v.videoHeight*scale);canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',0.82);try{await put('photos',{id:id(),item:cameraItem,data});closeCamera();await render()}catch(e){alert('Fotografii se nepodařilo uložit: '+e.message)}}
async function addPhotos(ev,item){try{for(let f of ev.target.files){if(!f.type.startsWith('image/'))continue;let data=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});await put('photos',{id:id(),item,data})}render()}catch(e){alert('Fotografii se nepodařilo uložit. Zkontroluj volné místo.')}}async function deletePhoto(i){if(confirm('Smazat fotografii?')){await remove('photos',i);render()}}function showPhoto(item,i){overlayBack();gallery=photos.filter(p=>p.item===item);gi=gallery.findIndex(p=>p.id===i);document.getElementById('viewer').style.display='flex';movePhoto(0)}function movePhoto(n){if(!gallery.length)return;gi=(gi+n+gallery.length)%gallery.length;document.getElementById('big').src=gallery[gi].data}function closePhoto(fromBack=false){document.getElementById('viewer').style.display='none';if(!fromBack&&history.state?.overlay)history.back()}
function printData(i,withPhotos=false,mail=false){let x=get(i),sheets=x.type==='action'?children(i,'sheet'):[x];let w=window.open('','_blank');if(!w)return alert('Povol vyskakovací okna');let h=`<!doctype html><html lang="cs"><meta charset="utf-8"><title>evidence – tisk</title><style>body{font:13px Arial;padding:15px}table{border-collapse:collapse;width:100%;margin-bottom:20px}td,th{border:1px solid #888;padding:7px;text-align:left}@page{size:A4 landscape;margin:12mm}</style><h1>${safe(x.name)}</h1>`;for(let s of sheets){h+=`<h2>${safe(s.name)}</h2><table><tr><th>Položka</th><th>Délka</th><th>Šířka</th><th>Výška</th><th>m³</th><th>Poznámka</th></tr>`;for(let z of children(s.id,'item'))h+=`<tr><td>${safe(z.name)}</td><td>${safe(z.l)}</td><td>${safe(z.w)}</td><td>${safe(z.h)}</td><td>${fmt(volume(z))}</td><td>${safe(z.note)}</td></tr>`;h+=`</table>`;if(withPhotos){for(let z of children(s.id,'item')){let pics=photos.filter(p=>p.item===z.id);if(pics.length)h+=`<section style="break-inside:avoid"><h3>${safe(z.name)} – fotografie</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${pics.map(p=>`<img src="${p.data}" style="width:100%;max-height:260px;object-fit:contain;break-inside:avoid">`).join('')}</div></section>`}}h+=`<p><b>Celkem: ${fmt(total(s.id))} m³</b></p>`}h+=withPhotos?`<p style="color:#666">Pro uložení PDF zvol v nabídce tisku „Uložit jako PDF“.</p>`:`<script>setTimeout(()=>window.print(),600)<\/script>`;w.document.write(h);w.document.close();if(withPhotos)setTimeout(()=>w.print(),1200);if(mail)alert('Po uložení PDF ho přilož k e-mailu. Automatické připojení PDF není ve všech prohlížečích dostupné.')}
function emailData(i){alert('Nejprve vytvoř PDF s fotografiemi a v dialogu zvol Uložit jako PDF. Potom soubor přilož v e-mailové aplikaci. Přímé připojení PDF zatím není k dispozici.');printData(i,true,false)}async function backup(){let data={version:1,items:await all('items'),photos:await all('photos')};let url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='evidence-zaloha-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function restore(ev){try{let f=ev.target.files[0];if(!f)return;let data=JSON.parse(await f.text());if(!Array.isArray(data.items)||!Array.isArray(data.photos))throw Error('Neplatný soubor');if(!confirm('Nahradit všechna současná data obsahem zálohy?'))return;await clear('items');await clear('photos');for(let x of data.items)await put('items',x);for(let p of data.photos)await put('photos',p);nav('actions')}catch(e){alert('Obnovení se nezdařilo: '+e.message)}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});openDB();
