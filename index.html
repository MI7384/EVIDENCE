const itemDrafts=new Map();function draftKey(item){return 'evidence-item-draft-'+item}function captureItemDraft(){if(page.kind!=='edit'||!page.id||get(page.id)?.type!=='item')return;const fields=['name','l','w','h','note'],draft={};for(const key of fields){const el=document.getElementById(key);if(!el)return;draft[key]=el.value}itemDrafts.set(page.id,draft);try{sessionStorage.setItem(draftKey(page.id),JSON.stringify(draft))}catch(e){}}function restoreItemDraft(item){let draft=itemDrafts.get(item);if(!draft){try{draft=JSON.parse(sessionStorage.getItem(draftKey(item))||'null')}catch(e){}}if(!draft)return;for(const key of ['name','l','w','h','note']){const el=document.getElementById(key);if(el&&Object.prototype.hasOwnProperty.call(draft,key))el.value=draft[key]}updateVolume()}function clearItemDraft(item){itemDrafts.delete(item);try{sessionStorage.removeItem(draftKey(item))}catch(e){}}function nav(kind,id,replace=false){if(kind==='section'){openSection(id,pendingSection||'storage');return}page={kind,id};if(!replace)history.pushState({kind,id},'', '#'+kind+(id?'/'+id:''));render()}window.addEventListener('popstate',e=>{if(document.getElementById('cameraView').style.display==='flex'){closeCamera(true);return}if(document.getElementById('viewer').style.display==='flex'){closePhoto(true);return}page=e.state?.kind?e.state:{kind:'actions'};render()});history.replaceState({kind:'actions'},'','#actions');function overlayBack(){history.pushState({overlay:true},'','#photo');}let pendingSection='storage';const sections=[['storage','Skladování','▤'],['packedIn','Zabaleno na montáž','▣'],['packedOut','Zabaleno z demontáže','↩'],['loading','Nakládka','▰']];const sectionName=k=>sections.find(x=>x[0]===k)?.[1]||'Skladování';const sectionOf=x=>x.section||'storage';function openSection(fair,section){page={kind:'section',id:fair,section};history.pushState({...page},'','#section/'+fair+'/'+section);render()}function openSectionExport(fair,section){page={kind:'sectionExport',id:fair,section};history.pushState({...page},'','#sectionExport/'+fair+'/'+section);render()}function exportLayout(printAction,pdfPhotos,pdfText,mailPhotos,mailText){return `<div class="export-layout"><div class="export-group"><h3>♧ Tisk</h3><button type="button" class="export-wide" onclick="${printAction}">▤ &nbsp; Tisknout evidenci</button></div><div class="export-group"><h3>▤ Uložit PDF</h3><div class="export-pair"><button type="button" onclick="${pdfPhotos}">▧<span>PDF s fotografiemi</span></button><button type="button" onclick="${pdfText}">▤<span>PDF bez fotografií</span></button></div></div><div class="export-group"><h3>✉ Odeslat</h3><div class="export-pair"><button type="button" onclick="${mailPhotos}">✉<span>Odeslat PDF s fotografiemi</span></button><button type="button" onclick="${mailText}">✉<span>Odeslat PDF bez fotografií</span></button></div></div></div>`}const button=(label,fn,cl='')=>`<button class="${cl}" onclick="${fn}">${label}</button>`;function row(x,next){let detail=x.type==='action'?`Místo: ${safe(x.place||'–')}${x.standName?`<br>Stánek: ${safe(x.standName)}`:''}${x.hall?`<br>Hala: ${safe(x.hall)}`:''}${x.standNumber?`<br>Číslo stánku: ${safe(x.standNumber)}`:''}<br>Montáž: ${dateRange(x.mountFrom,x.mountTo)}<br>Průběh: ${dateRange(x.fairFrom,x.fairTo)}<br>Demontáž: ${dateRange(x.dismountFrom,x.dismountTo)}`:x.type==='item'?`Rozměry: ${safe(x.l||'–')} × ${safe(x.w||'–')} × ${safe(x.h||'–')} cm · ${fmt(volume(x))} m³`:`Objem: ${fmt(total(x.id))} m³${x.type==='sheet'?`<br>Spedice: ${safe(x.shipper||'–')}`:''}`;return `<div class="card"><div class="line"><div><strong>${safe(x.name)}</strong><div class="muted">${detail}</div></div>${button('Otevřít',`nav('${next}','${x.id}')`)}</div>${x.type==='item'?`<div class="photos">${photos.filter(p=>p.item===x.id).map(p=>`<img loading="lazy" role="button" tabindex="0" src="${p.data}" alt="Fotografie položky" onclick="showPhoto(\'${x.id}\',\'${p.id}\')" style="width:78px;height:78px;object-fit:cover;border-radius:7px;cursor: async function sharePdf(i,withPhotos,section=null){let container;try{const item=get(i);if(!item)return;await loadPdfLibraries();container=document.createElement('div');container.style.cssText='position:fixed;left:-10000px;top:0;width:1050px;background:white;z-index:-1';container.innerHTML='<style>'+pdfStyles+'</style><div class="pdf-body" style="background:white;width:1050px;padding:20px">'+pdfHtml(i,withPhotos,section)+'</div>';document.body.appendChild(container);const element=container.querySelector('.pdf-body');await Promise.all(Array.from(element.querySelectorAll('img')).map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve})));const canvas=await html2canvas(element,{scale:1.4,backgroundColor:'#ffffff',useCORS:true,logging:false});const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true});const pageWidth=pdf.internal.pageSize.getWidth(),pageHeight=pdf.internal.pageSize.getHeight(),margin=8,printWidth=pageWidth-2*margin,printHeight=pageHeight-2*margin;const sliceHeight=Math.floor(canvas.width*printHeight/printWidth);let y=0,page=0;while(y<canvas.height){const height=Math.min(sliceHeight,canvas.height-y);const part=document.createElement('canvas');part.width=canvas.width;part.height=height;part.getContext('2d').drawImage(canvas,0,y,canvas.width,height,0,0,canvas.width,height);if(page++)pdf.addPage();pdf.addImage(part.toDataURL('image/jpeg',0.86),'JPEG',margin,margin,printWidth,height*printWidth/canvas.width);y+=height}const blob=pdf.output('blob');const name='evidence-'+(section?sectionName(section)+'-':'')+item.name+(withPhotos?'-s-fotografiemi':'-bez-fotografii')+'.pdf';const filename=name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'-');const file=new File([blob],filename,{type:'application/pdf'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'evidence – '+item.name,text:'PDF export z aplikace evidence'});}else{const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);alert('Telefon nepodporuje přímé sdílení PDF. Soubor se stáhl; přilož jej prosím k e-mailu.')}}catch(e){if(e.name!=='AbortError')alert('PDF se nepodařilo připravit: '+e.message)}finally{container?.remove()}}
function emailData(i){alert('Nejprve vytvoř PDF s fotografiemi a v dialogu zvol Uložit jako PDF. Potom soubor přilož v e-mailové aplikaci. Přímé připojení PDF zatím není k dispozici.');printData(i,true,false)}async function backup(){let data={version:1,items:await all('items'),photos:await all('photos')};let url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='evidence-zaloha-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function restore(ev){try{let f=ev.target.files[0];if(!f)return;let data=JSON.parse(await f.text());if(!Array.isArray(data.items)||!Array.isArray(data.photos))throw Error('Neplatný soubor');if(!await appConfirm('Nahradit všechna současná data obsahem zálohy?'))return;await clear('items');await clear('photos');for(let x of data.items)await put('items',x);for(let p of data.photos)await put('photos',p);nav('actions')}catch(e){alert('Obnovení se nezdařilo: '+e.message)}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});openDB();
</script></body></html>
