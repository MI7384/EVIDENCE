</style></head><body><div id="launchSplash" aria-label="Spouští se evidence" hidden><img src="icon.svg?v=6" alt="evidence" width="220" height="220"></div><header><div class="brand"><svg class="brand-check" viewBox="0 0 100 100" aria-hidden="true"><path d="M16 53 L37 74 L83 22" fill="none" stroke="#00bff2" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg><strong>evidence</strong></div></header><main id="app"></main><div id="confirmOverlay" class="confirm-overlay" hidden><div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage"><h3 id="confirmTitle">Potvrzení</h3><p id="confirmMessage"></p><div class="confirm-actions"><button type="button" class="secondary" id="confirmCancel">Zrušit</button><button type="button" class="danger" id="confirmAccept">Smazat</button></div></div></div><div id="noticeOverlay" class="notice-overlay" hidden><div class="notice-card" role="alertdialog" aria-modal="true" aria-labelledby="noticeTitle" aria-describedby="noticeMessage"><div id="noticeTitle" class="notice-heading">evidence</div><div class="notice-content"><span class="notice-icon" aria-hidden="true">i</span><span id="noticeMessage" class="notice-message"></span></div><div class="notice-actions"><button type="button" id="noticeOk">OK</button></div></div></div><div id="shipperPicker" class="picker-overlay" hidden><div class="picker-panel" role="dialog" aria-modal="true" aria-label="Výběr spedice"><h3>Vyber spedici</h3><div id="shipperChoices"></div><button class="secondary" type="button" onclick="closeShipperPicker()">Zrušit</button></div></div><div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Prohlížení fotografií"><img id="big" alt="Zvětšená fotografie"><div id="photoCount" style="color:white;font-size:13px;margin-top:10px"></div><div class="buttons"><button onclick="closePhoto()">Zavřít</button></div></div><div id="cameraView" class="viewer" style="z-index:20"><video id="cameraVideo" autoplay playsinline muted style="width:100%;max-height:72vh;object-fit:contain"></video><div class="buttons"><button type="button" onclick="takeCameraPhoto()">📸 Vyfotit</button><button type="button" onclick="closeCamera()">Zavřít</button></div><p id="cameraMessage" style="color:white;font-size:14px;text-align:center"></p></div><script>
const splashEl=document.getElementById('launchSplash');if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true){splashEl.hidden=false;setTimeout(()=>{splashEl.classList.add('hide');setTimeout(()=>splashEl.remove(),300)},2000)}else{splashEl.remove()}
let db,items=[],photos=[],page={kind:'actions'},gallery=[],gi=0;const app=document.getElementById('app');app.addEventListener('input',e=>{if(['name','l','w','h','note'].includes(e.target.id))captureItemDraft()});const id=()=>crypto.randomUUID();const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateRange=(a,b)=>[a,b].map(d=>d?new Date(d+'T12:00:00').toLocaleDateString('cs-CZ'):'–').join(' – ');const fmt=n=>Number(n||0).toLocaleString('cs-CZ',{maximumFractionDigits:6});let itemById=new Map(),childrenByParent=new Map(),photoByItem=new Map(),photoCache=null;
function indexItems(){itemById=new Map();childrenByParent=new Map();for(const x of items){itemById.set(x.id,x);const key=String(x.parent)+'|'+x.type;if(!childrenByParent.has(key))childrenByParent.set(key,[]);childrenByParent.get(key).push(x)}for(const [key,list] of childrenByParent){const t=key.slice(key.lastIndexOf('|')+1);list.sort((a,b)=>t==='action'?(b.created||0)-(a.created||0):(a.created||0)-(b.created||0))}}
function indexPhotos(){photoByItem=new Map();for(const p of photos){if(!photoByItem.has(p.item))photoByItem.set(p.item,[]);photoByItem.get(p.item).push(p)}}
const children=(p,t)=>childrenByParent.get(String(p)+'|'+t)||[];
const get=i=>itemById.get(i);
const picsFor=i=>photoByItem.get(i)||[];
const photoPreview=p=>p.thumb||p.data;
async function createPhotoThumbnail(data){return new Promise(resolve=>{const img=new Image();img.onload=()=>{try{const max=220,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',0.72))}catch(e){resolve(null)}finally{img.src=''}};img.onerror=()=>resolve(null);img.src=data})}
let thumbnailMigrationRunning=false;
async function migratePhotoThumbnails(){if(thumbnailMigrationRunning||!db)return;thumbnailMigrationRunning=true;try{let updated=0;for(const p of photos){if(p.thumb||!p.data)continue;await new Promise(r=>setTimeout(r,25));const thumb=await createPhotoThumbnail(p.data);if(!thumb)continue;await put('photos',{...p,thumb});updated++;if(updated%8===0)await new Promise(r=>setTimeout(r,60))}if(updated&&['entries','notes','section','edit','note','truck'].includes(page.kind))await render()}catch(e){console.warn('Náhledy:',e)}finally{thumbnailMigrationRunning=false}}
function scheduleThumbnailMigration(){if(photos.some(p=>!p.thumb&&p.data)&&!thumbnailMigrationRunning)setTimeout(migratePhotoThumbnails,600)}
const volume=x=>[x.l,x.w,x.h].every(v=>v!==''&&v!=null&&Number(v)>=0)?Number(x.l)*Number(x.w)*Number(x.h)/1000000:0;function total(i){let x=get(i);if(!x)return 0;if(x.type==='item')return volume(x);return children(i,x.type==='action'?'sheet':'item').reduce((s,c)=>s+total(c.id),0)}
function openDB(){let r=indexedDB.open('evidence-pwa',1);r.onupgradeneeded=()=>{r.result.createObjectStore('items',{keyPath:'id'});r.result.createObjectStore('photos',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;render()};r.onerror=()=>appAlert('Databázi se nepodařilo otevřít.')}function all(n){if(n==='photos'&&photoCache)return Promise.resolve(photoCache);return new Promise((ok,no)=>{let r=db.transaction(n).objectStore(n).getAll();r.onsuccess=()=>{if(n==='photos')photoCache=r.result;ok(r.result)};r.onerror=()=>no(r.error)})}function put(n,v){return new Promise((ok,no)=>{let r=db.transaction(n,'readwrite').objectStore(n).put(v);r.onsuccess=()=>{if(n==='photos'&&photoCache){const at=photoCache.findIndex(p=>p.id===v.id);if(at<0)photoCache.push(v);else photoCache[at]=v}ok()};r.onerror=()=>no(r.error)})}function remove(n,i){return new Promise((ok,no)=>{let r=db.transaction(n,'readwrite').objectStore(n).delete(i);r.onsuccess=()=>{if(n==='photos'&&photoCache){const at=photoCache.findIndex(p=>p.id===i);if(at>=0)photoCache.splice(at,1)}ok()};r.onerror=()=>no(r.error)})}function clear(n){return new Promise((ok,no)=>{let r=db.transaction(n,'readwrite').objectStore(n).clear();r.onsuccess=()=>{if(n==='photos'){photoCache=[];photos=[];indexPhotos()}ok()};r.onerror=()=>no(r.error)})}
const itemDrafts=new Map();function draftKey(item){return 'evidence-item-draft-'+item}function captureItemDraft(){if(page.kind!=='edit'||!page.id||get(page.id)?.type!=='item')return;const fields=['name','l','w','h','note'],draft={};for(const key of fields){const el=document.getElementById(key);if(!el)return;draft[key]=el.value}itemDrafts.set(page.id,draft);try{sessionStorage.setItem(draftKey(page.id),JSON.stringify(draft))}catch(e){}}function restoreItemDraft(item){let draft=itemDrafts.get(item);if(!draft){try{draft=JSON.parse(sessionStorage.getItem(draftKey(item))||'null')}catch(e){}}if(!draft)return;for(const key of ['name','l','w','h','note']){const el=document.getElementById(key);if(el&&Object.prototype.hasOwnProperty.call(draft,key))el.value=draft[key]}updateVolume()}function clearItemDraft(item){itemDrafts.delete(item);try{sessionStorage.removeItem(draftKey(item))}catch(e){}}function nav(kind,id,replace=false){if(kind==='section'){openSection(id,pendingSection||'storage');return}page={kind,id};if(!replace)history.pushState({kind,id},'', '#'+kind+(id?'/'+id:''));render()}window.addEventListener('popstate',e=>{if(document.getElementById('cameraView').style.display==='flex'){closeCamera(true);return}if(document.getElementById('viewer').style.display==='flex'){closePhoto(true);return}page=e.state?.kind?e.state:{kind:'actions'};render()});history.replaceState({kind:'actions'},'','#actions');function overlayBack(){history.pushState({overlay:true},'','#photo');}let pendingSection='storage';const sections=[['storage','Skladování','▤'],['packedIn','Zabaleno na montáž','▣'],['packedOut','Zabaleno z demontáže','↩'],['loading','Nakládka','▰'],['notes','Poznámky','▤']];const fairIcons={"pin":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M12 22s7-7 7-13a7 7 0 1 0-14 0c0 6 7 13 7 13z\"/><circle cx=\"12\" cy=\"9\" r=\"2.5\"/></svg>","booth":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"6\" width=\"18\" height=\"14\" rx=\"1\"/><path d=\"M2 6h20M8 20v-5h8v5M8 10h2m4 0h2\"/></svg>","hall":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 21V9l9-6 9 6v12zM9 21v-7h6v7M7 11h2m6 0h2\"/></svg>","calendar":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M7 2v6m10-6v6M3 11h18\"/></svg>"};const fairIcon=k=>fairIcons[k]||'';const tileIcons={"storage":"<svg viewBox=\"0 0 64 64\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><g fill=\"currentColor\"><rect x=\"23\" y=\"5\" width=\"18\" height=\"17\" rx=\"2\"/><rect x=\"9\" y=\"26\" width=\"20\" height=\"18\" rx=\"2\"/><rect x=\"35\" y=\"26\" width=\"20\" height=\"18\" rx=\"2\"/><rect x=\"5\" y=\"49\" width=\"54\" height=\"5\" rx=\"1\"/><rect x=\"9\" y=\"54\" width=\"8\" height=\"6\"/><rect x=\"47\" y=\"54\" width=\"8\" height=\"6\"/></g><g fill=\"#0b4f78\"><rect x=\"30\" y=\"10\" width=\"5\" height=\"3\" rx=\"1\"/><rect x=\"16\" y=\"31\" width=\"5\" height=\"3\" rx=\"1\"/><rect x=\"42\" y=\"31\" width=\"5\" height=\"3\" rx=\"1\"/></g></svg>","packedIn":"<svg viewBox=\"0 0 64 64\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><g stroke=\"currentColor\" stroke-width=\"5.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 8h11l9 39h27\"/><path d=\"M23 48 16 18\"/><path d=\"M23 48 53 40\"/><path d=\"M31 14 49 11l7 28-19 5z\" fill=\"currentColor\" stroke=\"none\"/></g><circle cx=\"28\" cy=\"54\" r=\"5.5\" fill=\"currentColor\"/><path d=\"m39 18 6-1\" stroke=\"#23516d\" stroke-width=\"3\"/></svg>","packedOut":"<svg viewBox=\"0 0 64 64\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"m7 34 25-11 25 11-25 12z\" fill=\"currentColor\"/><path d=\"M7 35v17l24 10V46zM57 35v17L33 62V46z\" fill=\"currentColor\"/><path d=\"M14 22c3-13 19-18 31-9\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\"/><path d=\"m39 5 10 10-12 6\" fill=\"currentColor\"/><path d=\"m15 22-8-8 2 13\" fill=\"currentColor\"/></svg>","loading":"<svg viewBox=\"0 0 64 64\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M3 14h34a3 3 0 0 1 3 3v29H3z\" fill=\"currentColor\"/><path d=\"M40 24h11l10 12v10H40z\" fill=\"currentColor\"/><path d=\"M44 28h6l6 8H44z\" fill=\"#0b4e77\"/><circle cx=\"16\" cy=\"49\" r=\"8\" fill=\"#0b4e77\"/><circle cx=\"16\" cy=\"49\" r=\"4.5\" fill=\"currentColor\"/><circle cx=\"50\" cy=\"49\" r=\"8\" fill=\"#0b4e77\"/><circle cx=\"50\" cy=\"49\" r=\"4.5\" fill=\"currentColor\"/></svg>","notes":"<svg viewBox=\"0 0 64 64\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"8\" y=\"10\" width=\"39\" height=\"49\" rx=\"4\" stroke=\"currentColor\" stroke-width=\"5\"/><rect x=\"21\" y=\"5\" width=\"13\" height=\"12\" rx=\"4\" stroke=\"currentColor\" stroke-width=\"4.5\"/><path d=\"M17 26h23M17 35h23M17 44h15\" stroke=\"currentColor\" stroke-width=\"4.5\" stroke-linecap=\"round\"/><path d=\"m34 52 17-18 8 8-18 18-10 3z\" fill=\"currentColor\" stroke=\"#1a4c6e\" stroke-width=\"2\"/><path d=\"m49 37 7 7\" stroke=\"#1a4c6e\" stroke-width=\"2\"/></svg>"};const tileIcon=k=>tileIcons[k]||'▤';const truckDrafts={};function createLoading(fair){page={kind:'newTruck',id:fair};history.pushState({...page},'','#newTruck/'+fair);render()}function captureTruckDraft(){if(page.kind==='truck'){const n=document.getElementById('truckName'),t=document.getElementById('truckNote');if(n&&t)truckDrafts[page.id]={name:n.value,note:t.value}}}async function saveTruck(i){const x=get(i),name=document.getElementById('truckName').value.trim();if(!name)return appAlert('Vyplň název kamionu.');x.name=name;x.note=document.getElementById('truckNote').value;await put('items',x);delete truckDrafts[i];openSection(x.parent,'loading')}async function saveNewTruck(){const name=document.getElementById('newTruckName').value.trim();if(!name)return appAlert('Vyplň název kamionu.');const fair=page.id;const x={id:id(),type:'truck',parent:fair,name,note:'',created:Date.now()+Math.random()};await put('items',x);nav('truck',x.id)}const sectionName=k=>sections.find(x=>x[0]===k)?.[1]||'Skladování';const sectionOf=x=>x.section||'storage';function openSection(fair,section){page={kind:'section',id:fair,section};history.pushState({...page},'','#section/'+fair+'/'+section);render()}function openSectionExport(fair,section){page={kind:'sectionExport',id:fair,section};history.pushState({...page},'','#sectionExport/'+fair+'/'+section);render()}function exportLayout(printAction,pdfPhotos,pdfText,mailPhotos,mailText,whatsappAction){return `<div class="export-layout"><div class="export-group"><h3>♧ Tisk</h3><button type="button" class="export-wide" onclick="${printAction}">▤ &nbsp; Tisknout evidenci</button></div><div class="export-group"><h3>▤ Uložit PDF</h3><div class="export-pair"><button type="button" onclick="${pdfPhotos}">▧<span>PDF s fotografiemi</span></button><button type="button" onclick="${pdfText}">▤<span>PDF bez fotografií</span></button></div></div><div class="export-group"><h3>✉ Odeslat</h3><div class="export-pair"><button type="button" onclick="${mailPhotos}">✉<span>Odeslat PDF s fotografiemi</span></button><button type="button" onclick="${mailText}">✉<span>Odeslat PDF bez fotografií</span></button></div><button type="button" class="export-whatsapp" onclick="${whatsappAction}">Sdílet přes WhatsApp (bez PDF)</button></div></div>`}function photoOnlyExportLayout(fair,key){return `<div class="export-layout"><div class="export-group"><h3>♧ Tisk</h3><button type="button" class="export-wide" onclick="printSection('${fair}','${key}',true)">▤ &nbsp; Tisknout fotografie</button></div><div class="export-group"><h3>▤ Uložit</h3><button type="button" class="export-wide" onclick="sharePdf('${fair}',true,'${key}')">▧ &nbsp; Uložit fotografie (PDF)</button></div></div>`}const button=(label,fn,cl='')=>`<button class="${cl}" onclick="${fn}">${label}</button>`;function row(x,next){let detail=x.type==='action'?`Místo: ${safe(x.place||'–')}${x.standName?`<br>Stánek: ${safe(x.standName)}`:''}${x.hall?`<br>Hala: ${safe(x.hall)}`:''}${x.standNumber?`<br>Číslo stánku: ${safe(x.standNumber)}`:''}<br>Montáž: ${dateRange(x.mountFrom,x.mountTo)}<br>Průběh: ${dateRange(x.fairFrom,x.fairTo)}<br>Demontáž: ${dateRange(x.dismountFrom,x.dismountTo)}`:x.type==='item'?`Rozměry: ${safe(x.l||'–')} × ${safe(x.w||'–')} × ${safe(x.h||'–')} cm · ${fmt(volume(x))} m³`:`Objem: ${fmt(total(x.id))} m³${x.type==='sheet'?`<br>Spedice: ${safe(x.shipper||'–')}`:''}`;return `<div class="card"><div class="line"><div><strong>${safe(x.name)}</strong><div class="muted">${detail}</div></div>${button('Otevřít',`nav('${next}','${x.id}')`)}</div>${x.type==='item'?`<div class="photos">${picsFor(x.id).map(p=>`<img loading="lazy" role="button" tabindex="0" src="${photoPreview(p)}" alt="Fotografie položky" onclick="showPhoto(\'${x.id}\',\'${p.id}\')" style="width:78px;height:78px;object-fit:cover;border-radius:7px;cursor:pointer">`).join('')}</div>${x.note&&x.note.trim()?`<div class="item-note"><strong>Poznámka</strong><div>${safe(x.note)}</div></div>`:''}`:'' }<div class="buttons">${x.type==='item'||x.type==='action'?'':button('Upravit',`nav('edit','${x.id}')`,'secondary')}${button('Smazat',`erase('${x.id}')`,'danger')}</div></div>`}
async function render(){items=await all('items');indexItems();photos=await all('photos');indexPhotos();scheduleThumbnailMigration();let h='';if(page.kind==='actions'){h=`<div class="toolbar home-toolbar">${button('+ Přidat veletrh',"create('action',null)")}<div class="backup-actions">${button('Stáhnout zálohu','backup()','secondary')}<label class="filebutton" style="margin:0">Obnovit zálohu<input type="file" accept=".json" onchange="restore(event)"></label></div></div>`;for(let x of children(null,'action'))h+=row(x,'sheets')}
if(page.kind==='sheets'){let a=get(page.id);if(!a)return nav('actions');h=`<div class="toolbar fair-toolbar">${button('← Zpět',"nav('actions')",'secondary')}${button('Upravit veletrh',`nav('edit','${a.id}')`,'secondary')}</div><div class="card fair-info"><h2>${safe(a.name)}</h2><div class="fair-meta"><div><span class="fair-meta-icon">${fairIcon('pin')}</span><span><b>Místo:</b> ${safe(a.place||'–')}</span></div><div><span class="fair-meta-icon">${fairIcon('booth')}</span><span><b>Název stánku:</b> ${safe(a.standName||'–')}</span></div><div><span class="fair-meta-icon">${fairIcon('hall')}</span><span><b>Hala:</b> ${safe(a.hall||'–')} &nbsp; <b>Číslo stánku:</b> ${safe(a.standNumber||'–')}</span></div></div><div class="fair-dates"><div><strong>${fairIcon('calendar')} Montáž</strong><span>${dateRange(a.mountFrom,a.mountTo)}</span></div><div><strong>${fairIcon('calendar')} Průběh veletrhu</strong><span>${dateRange(a.fairFrom,a.fairTo)}</span></div><div><strong>${fairIcon('calendar')} Demontáž</strong><span>${dateRange(a.dismountFrom,a.dismountTo)}</span></div></div></div><div class="fair-tiles">${sections.map(([key,title])=>`<div class="fair-tile fair-tile-${key} ${key==='notes'?'fair-tile-wide':''}"><button type="button" class="tile-open" onclick="openSection('${a.id}','${key}')"><span class="tile-symbol" aria-hidden="true">${tileIcon(key)}</span><span class="tile-name">${title}</span><span class="tile-chevron" aria-hidden="true">›</span></button><button type="button" class="tile-export" onclick="openSectionExport('${a.id}','${key}')"><span aria-hidden="true">▤</span> Export</button></div>`).join('')}</div>`}
if(page.kind==='notes'){const fair=get(page.id);if(!fair)return nav('actions');h=`<div class="toolbar section-toolbar">${button('← Zpět',`nav('sheets','${fair.id}')`,'secondary')}${button('+ Přidat list',`newNote('${fair.id}')`)}</div><h2>Poznámky</h2>`;for(const n of children(fair.id,'note')){const pics=picsFor(n.id);h+=`<div class="card"><div class="line"><div><strong>${safe(n.name)}</strong></div>${button('Otevřít',`nav('note','${n.id}')`)}</div><div class="photos">${pics.map(p=>`<img loading="lazy" role="button" tabindex="0" decoding="async" src="${photoPreview(p)}" alt="Fotografie poznámky" onclick="showPhoto('${n.id}','${p.id}')" style="width:78px;height:78px;object-fit:cover;border-radius:7px;cursor:pointer">`).join('')}</div>${n.note&&n.note.trim()?`<div class="item-note"><strong>Poznámka</strong><div>${safe(n.note)}</div></div>`:''}<div class="buttons">${button('Smazat',`erase('${n.id}')`,'danger')}</div></div>`}}
if(page.kind==='newNote'){h=`<div class="toolbar">${button('← Zpět',`nav('notes','${page.id}')`,'secondary')}</div><h2>Nový list poznámek</h2><div class="card"><label>Název listu</label><input id="noteNewName" placeholder="Např. Logistika"><div class="buttons">${button('Vytvořit list','saveNewNote()')}</div></div>`}

async function shareWhatsApp(i,section=null){
 const x=get(i);if(!x)return;
 let records=[],pictures=[];

  const files=[];
  for(let n=0;n<pictures.length;n++){
   const p=pictures[n];const blob=await(await fetch(p.data)).blob();
   files.push(new File([blob],'evidence-foto-'+(n+1)+'.'+(blob.type==='image/png'?'png':'jpg'),{type:blob.type||'image/jpeg'}))
  }
  if(files.length){
   if(!navigator.canShare?.({files})){appAlert('Telefon nepodporuje přímé sdílení těchto fotografií. Text bez fotografií jsem neodeslal. Zkus sdílet menší počet snímků nebo export do PDF.');return}
   try{await navigator.share({title:'evidence',text:message,files})}
   catch(e){if(e.name==='AbortError')return;if(e.name==='TypeError'||e.name==='NotAllowedError'){try{await navigator.share({files,title:'evidence'})}catch(e2){if(e2.name!=='AbortError')throw e2}}else throw e}
  }else{

  }
 }catch(e){if(e.name!=='AbortError')appAlert('Sdílení se nezdařilo: '+e.message)}
}

async function sharePdf(i,withPhotos,section=null){let container;try{const item=get(i);if(!item)return;await loadPdfLibraries();container=document.createElement('div');container.style.cssText='position:fixed;left:-10000px;top:0;width:695px;background:white;z-index:-1';container.innerHTML='<style>'+pdfStyles+'</style><div class="pdf-body" style="background:white;width:695px;padding:0">'+pdfHtml(i,withPhotos,section)+'</div>';document.body.appendChild(container);const element=container.querySelector('.pdf-body');await Promise.all(Array.from(element.querySelectorAll('img')).map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve})));const canvas=await html2canvas(element,{scale:1.4,backgroundColor:'#ffffff',useCORS:true,logging:false});const pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});const pageWidth=pdf.internal.pageSize.getWidth(),pageHeight=pdf.internal.pageSize.getHeight(),margin=13,printWidth=pageWidth-2*margin,printHeight=pageHeight-2*15;const scaleY=canvas.height/Math.max(1,element.getBoundingClientRect().height);const maxSlice=Math.floor(canvas.width*printHeight/printWidth);const origin=element.getBoundingClientRect().top;const boundaries=[0,canvas.height];element.querySelectorAll('tr,section,img,h2,h3,p').forEach(node=>{const rect=node.getBoundingClientRect();if(rect.height>0){const top=Math.round((rect.top-origin)*scaleY),bottom=Math.round((rect.bottom-origin)*scaleY);if(top>0&&top<canvas.height)boundaries.push(top);if(bottom>0&&bottom<canvas.height)boundaries.push(bottom)}});boundaries.sort((a,b)=>a-b);let y=0,page=0;while(y<canvas.height){const limit=Math.min(canvas.height,y+maxSlice);let cut=limit;if(limit<canvas.height){const viable=boundaries.filter(b=>b>y+maxSlice*0.45&&b<=limit);if(viable.length)cut=viable[viable.length-1];}if(cut<=y)cut=limit;const height=cut-y;const part=document.createElement('canvas');part.width=canvas.width;part.height=height;part.getContext('2d').drawImage(canvas,0,y,canvas.width,height,0,0,canvas.width,height);if(page++)pdf.addPage();pdf.addImage(part.toDataURL('image/jpeg',0.86),'JPEG',margin,15,printWidth,height*printWidth/canvas.width);y=cut}const blob=pdf.output('blob');const name='evidence-'+(section?sectionName(section)+'-':'')+item.name+(withPhotos?'-s-fotografiemi':'-bez-fotografii')+'.pdf';const filename=name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'-');const file=new File([blob],filename,{type:'application/pdf'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'evidence – '+item.name,text:'PDF export z aplikace evidence'});}else{const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);appAlert('Telefon nepodporuje přímé sdílení PDF. Soubor se stáhl; přilož jej prosím k e-mailu.')}}catch(e){if(e.name!=='AbortError')appAlert('PDF se nepodařilo připravit: '+e.message)}finally{container?.remove()}}
