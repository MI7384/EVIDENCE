<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#38393c"><link rel="manifest" href="manifest.webmanifest"><title>evidence</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#222;font:16px system-ui,Arial}header{background:#38393c;color:white;padding:17px;display:flex;justify-content:space-between}header strong{font-weight:500}main{max-width:750px;margin:auto;padding:16px}h2{margin:8px 0 16px}.card{background:white;border-radius:10px;padding:15px;margin:10px 0;box-shadow:0 1px 5px #0001}.line,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.toolbar{justify-content:flex-start;margin-bottom:16px}button,.filebutton{border:0;border-radius:8px;background:#38393c;color:white;padding:11px 13px;font:inherit;font-size:14px;cursor:pointer}.secondary{background:#e4e5e7;color:#222}.danger{background:#a23d3d}.muted{color:#666;font-size:13px;margin-top:5px}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}label{display:block;margin-top:13px;margin-bottom:5px;font-size:14px}input:not([type=file]),textarea{width:100%;border:1px solid #c6c7c9;border-radius:8px;padding:10px;font:inherit}textarea{min-height:80px}.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.dims label{font-size:12px}.total{background:#e9eaec;padding:13px;border-radius:8px;margin-top:13px}.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.photo{position:relative}.photo img{width:90px;height:90px;object-fit:cover;border-radius:7px}.photo button{position:absolute;right:0;top:0;padding:2px 7px}.filebutton input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}.viewer{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;flex-direction:column;padding:14px;z-index:10}.viewer img{max-width:100%;max-height:78vh;object-fit:contain}@media print{header,.toolbar,.buttons,.photos,button{display:none!important}body{background:white}.card{box-shadow:none;border:1px solid #ccc}@page{size:A4 landscape;margin:12mm}}
</style></head><body><header><strong>evidence</strong><span>volllee</span></header><main id="app"></main><div id="viewer" class="viewer"><img id="big"><div class="buttons"><button onclick="movePhoto(-1)">◀</button><button onclick="closePhoto()">Zavřít</button><button onclick="movePhoto(1)">▶</button></div></div><script>
let db,items=[],photos=[],page={kind:'actions'},gallery=[],gi=0;const app=document.getElementById('app');const id=()=>crypto.randomUUID();const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString('cs-CZ',{maximumFractionDigits:6});const children=(p,t)=>items.filter(x=>x.parent===p&&x.type===t).sort((a,b)=>a.created-b.created);const get=i=>items.find(x=>x.id===i);const volume=x=>[x.l,x.w,x.h].every(v=>v!==''&&v!=null&&Number(v)>=0)?Number(x.l)*Number(x.w)*Number(x.h)/1000000:0;function total(i){let x=get(i);if(!x)return 0;if(x.type==='item')return volume(x);return children(i,x.type==='action'?'sheet':'item').reduce((s,c)=>s+total(c.id),0)}
function openDB(){let r=indexedDB.open('evidence-pwa',1);r.onupgradeneeded=()=>{r.result.createObjectStore('items',{keyPath:'id'});r.result.createObjectStore('photos',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;render()};r.onerror=()=>alert('Databázi se nepodařilo otevřít.')}function all(n){return new Promise((ok,no)=>{let r=db.transaction(n).objectStore(n).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function put(n,v){return new Promise((ok,no)=>{let r=db.transaction(n,'readwrite').objectStore(n).put(v);r.onsuccess=ok;r.onerror=()=>no(r.error)})}function remove(n,i){return new Promise((ok,no)=>{let r=db.transaction(n,'readwrite').objectStore(n).delete(i);r.onsuccess=ok;r.onerror=()=>no(r.error)})}function clear(n){return new Promise((ok,no)=>{let r=db.transaction(n,'readwrite').objectStore(n).clear();r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function nav(kind,id){page={kind,id};render()}const button=(label,fn,cl='')=>`<button class="${cl}" onclick="${fn}">${label}</button>`;function row(x,next){let detail=x.type==='item'?`Rozměry: ${safe(x.l||'–')} × ${safe(x.w||'–')} × ${safe(x.h||'–')} cm · ${fmt(volume(x))} m³`:`Kubatura: ${fmt(total(x.id))} m³`;return `<div class="card"><div class="line"><div><strong>${safe(x.name)}</strong><div class="muted">${detail}</div></div>${button('Otevřít',`nav('${next}','${x.id}')`)}</div><div class="buttons">${button('Upravit',`nav('edit','${x.id}')`,'secondary')}${button('Smazat',`erase('${x.id}')`,'danger')}</div></div>`}
async function render(){items=await all('items');photos=await all('photos');let h='';if(page.kind==='actions'){h=`<h2>Akce</h2><div class="toolbar">${button('+ Přidat akci',"create('action',null)")}${button('Stáhnout zálohu','backup()','secondary')}<label class="filebutton" style="margin:0">Obnovit zálohu<input type="file" accept=".json" onchange="restore(event)"></label></div>`;for(let x of children(null,'action'))h+=row(x,'sheets')}
if(page.kind==='sheets'){let a=get(page.id);if(!a)return nav('actions');h=`<div class="toolbar">${button('← Akce',"nav('actions')",'secondary')}${button('+ Přidat list',`create('sheet','${a.id}')`)}${button('Tisk / PDF',`printData('${a.id}')`,'secondary')}</div><h2>${safe(a.name)}</h2><p class="muted">Celková kubatura: ${fmt(total(a.id))} m³</p>`;for(let x of children(a.id,'sheet'))h+=row(x,'entries')}
if(page.kind==='entries'){let s=get(page.id);if(!s)return nav('actions');h=`<div class="toolbar">${button('← Listy',`nav('sheets','${s.parent}')`,'secondary')}${button('+ Přidat položku',`create('item','${s.id}')`)}${button('Tisk / PDF',`printData('${s.id}')`,'secondary')}</div><h2>${safe(s.name)}</h2><p class="muted">Kubatura listu: ${fmt(total(s.id))} m³</p>`;for(let x of children(s.id,'item'))h+=row(x,'edit')}
if(page.kind==='edit'){let x=get(page.id);if(!x)return nav('actions');let back=x.type==='item'?'entries':x.type==='sheet'?'sheets':'actions';h=`<div class="toolbar">${button('← Zpět',`nav('${back}','${x.parent||''}')`,'secondary')}</div><h2>${x.type==='item'?'Položka':x.type==='sheet'?'Evidenční list':'Akce'}</h2><div class="card"><label>Název</label><input id="name" value="${safe(x.name)}">`;if(x.type==='item'){h+=`<div class="dims">${[['l','Délka'],['w','Šířka'],['h','Výška']].map(([k,n])=>`<div><label>${n} (cm)</label><input type="number" min="0" step="any" id="${k}" value="${safe(x[k])}" oninput="updateVolume()"></div>`).join('')}</div><div class="total">Kubatura: <strong id="v">${fmt(volume(x))} m³</strong></div><label>Poznámka</label><textarea id="note">${safe(x.note)}</textarea><label>Fotografie</label><div class="buttons"><button type="button" onclick="document.getElementById('cameraInput').click()">📷 Pořídit fotografii</button><input id="cameraInput" type="file" accept="image/*" capture="environment" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" onchange="addPhotos(event,'${x.id}')"><button type="button" onclick="document.getElementById('galleryInput').click()">Vybrat z galerie</button><input id="galleryInput" type="file" accept="image/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" onchange="addPhotos(event,'${x.id}')"></div><div class="photos">${photos.filter(p=>p.item===x.id).map(p=>`<div class="photo"><img src="${p.data}" onclick="showPhoto('${x.id}','${p.id}')"><button class="danger" onclick="deletePhoto('${p.id}')">×</button></div>`).join('')}</div>`}h+=`<div class="buttons">${button('Uložit',`save('${x.id}')`)}</div></div>`}app.innerHTML=h}
async function create(type,parent){let n=prompt(type==='action'?'Název akce':type==='sheet'?'Název listu':'Název položky');if(!n?.trim())return;let x={id:id(),type,parent,name:n.trim(),created:Date.now()+Math.random(),l:'',w:'',h:'',note:''};await put('items',x);type==='item'?nav('edit',x.id):render()}
function updateVolume(){document.getElementById('v').textContent=fmt(volume({l:document.getElementById('l').value,w:document.getElementById('w').value,h:document.getElementById('h').value}))+' m³'}async function save(i){let x={...get(i),name:document.getElementById('name').value.trim()};if(!x.name)return alert('Zadej název');if(x.type==='item'){for(let k of ['l','w','h'])x[k]=document.getElementById(k).value;x.note=document.getElementById('note').value}await put('items',x);nav(x.type==='item'?'entries':x.type==='sheet'?'sheets':'actions',x.parent)}async function erase(i){if(!confirm('Smazat záznam včetně všech podřízených položek a fotografií?'))return;async function walk(i){for(let x of items.filter(x=>x.parent===i))await walk(x.id);for(let p of photos.filter(p=>p.item===i))await remove('photos',p.id);await remove('items',i)}await walk(i);render()}
async function addPhotos(ev,item){try{for(let f of ev.target.files){if(!f.type.startsWith('image/'))continue;let data=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});await put('photos',{id:id(),item,data})}render()}catch(e){alert('Fotografii se nepodařilo uložit. Zkontroluj volné místo.')}}async function deletePhoto(i){if(confirm('Smazat fotografii?')){await remove('photos',i);render()}}function showPhoto(item,i){gallery=photos.filter(p=>p.item===item);gi=gallery.findIndex(p=>p.id===i);document.getElementById('viewer').style.display='flex';movePhoto(0)}function movePhoto(n){if(!gallery.length)return;gi=(gi+n+gallery.length)%gallery.length;document.getElementById('big').src=gallery[gi].data}function closePhoto(){document.getElementById('viewer').style.display='none'}
function printData(i){let x=get(i),sheets=x.type==='action'?children(i,'sheet'):[x];let w=window.open('','_blank');if(!w)return alert('Povol vyskakovací okna');let h=`<!doctype html><html lang="cs"><meta charset="utf-8"><title>evidence – tisk</title><style>body{font:13px Arial;padding:15px}table{border-collapse:collapse;width:100%;margin-bottom:20px}td,th{border:1px solid #888;padding:7px;text-align:left}@page{size:A4 landscape;margin:12mm}</style><h1>${safe(x.name)}</h1>`;for(let s of sheets){h+=`<h2>${safe(s.name)}</h2><table><tr><th>Položka</th><th>Délka</th><th>Šířka</th><th>Výška</th><th>m³</th><th>Poznámka</th></tr>`;for(let z of children(s.id,'item'))h+=`<tr><td>${safe(z.name)}</td><td>${safe(z.l)}</td><td>${safe(z.w)}</td><td>${safe(z.h)}</td><td>${fmt(volume(z))}</td><td>${safe(z.note)}</td></tr>`;h+=`</table><p><b>Celkem: ${fmt(total(s.id))} m³</b></p>`}h+=`<script>setTimeout(()=>window.print(),400)<\/script>`;w.document.write(h);w.document.close()}
async function backup(){let data={version:1,items:await all('items'),photos:await all('photos')};let url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='evidence-zaloha-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function restore(ev){try{let f=ev.target.files[0];if(!f)return;let data=JSON.parse(await f.text());if(!Array.isArray(data.items)||!Array.isArray(data.photos))throw Error('Neplatný soubor');if(!confirm('Nahradit všechna současná data obsahem zálohy?'))return;await clear('items');await clear('photos');for(let x of data.items)await put('items',x);for(let p of data.photos)await put('photos',p);nav('actions')}catch(e){alert('Obnovení se nezdařilo: '+e.message)}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});openDB();
</script></body></html>
